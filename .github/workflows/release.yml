name: Release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2.3.4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v2
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1          
      - uses: olafurpg/setup-gpg@v3
      - uses: peaceiris/actions-hugo@v2.4.13
        with: 
          hugo-version: '0.89.4'
          extended: true      
      - run: sbt -J-Xmx3000m versionCheck ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      - name: website
        run: |
          sbt clean +docs/mdoc +docs/unidoc
          cd website
          hugo
          cd public
          touch .nojekyll
      - name: gh-pages-deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./website/public
  publish-gitlab:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2.3.4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v2
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - name: Publish to GitLab Packages
        run: |
          sbt -J-Xmx3000m 'set ThisBuild / publishTo := Some("gitlab" at "https://gitlab.com/api/v4/projects/86342759/packages/maven")' \
              versionCheck +publish
        env:
          GITLAB_DEPLOY_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
          GITLAB_DEPLOY_TOKEN_USER: ${{ secrets.GITLAB_DEPLOY_TOKEN_USER }}
